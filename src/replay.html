<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Race replay</title>
  <script src="lib/chart.min.js"></script>
  <link rel="stylesheet" href="replay.css">
</head>
<body>
  <header class="header">
    <h1>Race replay</h1>
    <span class="race-info" id="raceInfo">Loading...</span>
    <div class="sync-badge hidden" id="syncBanner">
      <span class="sync-icon"></span>
      <span class="sync-text">Syncing...</span>
    </div>
    <div class="rider-selector">
      <label for="riderSelect">Watching</label>
      <select id="riderSelect">
        <option value="">Loading...</option>
      </select>
    </div>
  </header>

  <main class="viz-area">
    <section class="course-profile" aria-label="Course profile">
      <div class="stats-line">
        <span class="stat you" id="statPosition" title="Position">#-</span>
        <span class="stat you" id="statPower" title="Power">- W</span>
        <span class="stat leader" id="statLeaderPower" title="Leader power">leader - W</span>
        <span class="stat hidden" id="statGapToLeader" title="Time gap to leader"></span>
        <span class="stat hidden" id="statGapToGroup" title="Time gap to group ahead"></span>
      </div>
      <div class="profile-stage">
        <div class="elevation-container" id="elevationContainer">
          <svg class="elevation-svg" id="elevationSvg" preserveAspectRatio="none"></svg>
          <div class="zoom-selection" id="zoomSelection" style="display: none;"></div>
          <div class="cursor-line" id="cursorLine"></div>
          <div class="cursor-info" id="cursorInfo"></div>
        </div>
        <div class="player-bar" id="playerBar" role="group" aria-label="Playback">
          <button type="button" class="play-btn" id="playBtn" aria-label="Play" aria-pressed="false" title="Play">
            <svg class="icon icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5v11l9-5.5z"/></svg>
            <svg class="icon icon-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg>
          </button>
          <span class="time-display" id="timeDisplay">0:00</span>
          <input type="range" class="scrubber" id="timeSlider" min="0" max="3600" value="0" aria-label="Race time">
          <div class="speed-control" id="speedControl" role="group" aria-label="Playback speed">
            <button type="button" class="speed-btn" data-speed="1" aria-pressed="false">1x</button>
            <button type="button" class="speed-btn" data-speed="5" aria-pressed="false">5x</button>
            <button type="button" class="speed-btn" data-speed="10" aria-pressed="true">10x</button>
            <button type="button" class="speed-btn" data-speed="30" aria-pressed="false">30x</button>
          </div>
          <button type="button" class="player-btn hidden" id="zoomResetBtn">Reset zoom</button>
        </div>
      </div>
      <div class="distance-markers" id="distanceMarkers">
        <span>0 km</span><span>10 km</span><span>20 km</span><span>30 km</span><span>42 km</span>
      </div>
    </section>

    <div class="details-row">
      <section class="panel standings-panel" aria-label="Standings">
        <input type="text" class="rider-search" id="riderSearch" placeholder="Search riders" aria-label="Search riders">
        <div class="compare-hint">Click rider to compare (max 4)</div>
        <div class="comparison-panel hidden" id="comparisonPanel"></div>
        <div class="standings-table" id="standings">Loading...</div>
      </section>
      <div class="charts-column">
        <div class="panel chart-panel">
          <h3>Power comparison <span id="compareLabel">(vs leader)</span></h3>
          <div class="chart-container">
            <canvas id="powerChart"></canvas>
          </div>
        </div>
        <div class="panel chart-panel">
          <h3>Heart rate comparison <span id="hrCompareLabel">(vs leader)</span></h3>
          <div class="chart-container">
            <canvas id="hrChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading race data...</div>
    </div>
  </div>

  <div id="errorOverlay" class="error-overlay hidden">
    <div class="error-content">
      <div class="error-icon">!</div>
      <div class="error-text" id="errorText">Error loading race</div>
      <button class="btn" id="closeBtn">Close</button>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="replay.js"></script>
</body>
</html>
